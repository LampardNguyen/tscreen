name: TScreen
options:
  bundleIdPrefix: com.linh
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
settings:
  base:
    SWIFT_VERSION: "5"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  TScreen:
    type: application
    platform: macOS
    sources: [TScreen, Shared]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: TScreen/Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: TScreen
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linh.tscreen
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES # chặn chèn dylib/debug vào app đang giữ quyền Screen Recording
  TScreen-iOS:
    type: application
    platform: iOS
    sources: [TScreen-iOS, Shared]
    configFiles:
      Debug: TScreen-iOS/Signing.xcconfig
      Release: TScreen-iOS/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linh.tscreen.ios
        PRODUCT_NAME: TScreen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TScreen
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TScreenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [TScreenTests]
    dependencies:
      - target: TScreen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TScreen:
    build:
      targets:
        TScreen: all
        TScreenTests: [test]
    test:
      targets: [TScreenTests]
  TScreen-iOS:
    build:
      targets:
        TScreen-iOS: all
